<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tool activity disclosure</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement as h } from "react";
      import { createRoot } from "react-dom/client";
      import { I18nBootstrap } from "../../src/components/I18nBootstrap.tsx";
      import { ToolCallsBlock } from "../../src/components/ToolCallsBlock.tsx";
      import "../../src/styles.css";

      const live = new URLSearchParams(location.search).get("live") === "1";
      const response = h(
        "div",
        { "data-testid": "response" },
        live ? "Opening the terminal now…" : "Terminal is open and ready.",
      );
      const bubble = h(
        "div",
        {
          className:
            "max-w-[74%] space-y-2.5 rounded-[20px] bg-muted px-[18px] py-3 text-[15.5px] leading-[1.5] text-foreground",
        },
        response,
        h(ToolCallsBlock, {
          block: {
            kind: "steps",
            steps: [
              { label: "Shell", count: 1 },
              { label: "Read file", count: 1 },
            ],
            calls: [
              {
                executionId: "call-1",
                name: "shell",
                input: { command: "git status --short" },
                ...(live ? {} : { output: { exitCode: 0, stdout: "clean" } }),
                status: live ? "running" : "succeeded",
              },
              {
                executionId: "call-2",
                name: "read_file",
                input: { path: "README.md" },
                ...(live ? {} : { output: "Project notes" }),
                status: live ? "running" : "succeeded",
              },
            ],
          },
        }),
      );
      createRoot(document.getElementById("root")).render(
        h(I18nBootstrap, null,
          h(
            "main",
            {
              className:
                "flex min-h-screen items-end bg-background px-4 py-6 md:px-8 md:py-8",
            },
            h("div", { className: "flex w-full justify-start" }, bubble),
          ),
        ),
      );
    </script>
  </body>
</html>
